name: Visual V3 Revision Review
on:
  pull_request:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run start > /tmp/spline.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/spline.log
          exit 1
      - name: Capture revision
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/visual-review.spec.ts --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-v3-revision
          path: artifacts/visual-review/
          if-no-files-found: error
          retention-days: 1
