name: Import owner-supplied showroom photograph (one-time)
on:
  push:
    branches: [feature/gallery-new-first-photo-20261011]
    paths:
      - .github/workflows/import-showroom-photo-20261011.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and optimize the authentic supplied photograph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/gallery
          curl --fail --location --retry 3 --silent --show-error "https://d2ol7oe51mr4n9.cloudfront.net/user_3IwyFwSIl4DSmyJVLt9bW4ap9Fn/162f730e-5d17-4adf-84f1-62f8f3a55f30.heic" -o /tmp/supplier-showroom.heic
          printf '%s  %s\n' '8bfdfe7eb13894cb803225ca2308be7b8064d6b908baeaa2188965fcb66d66c2' '/tmp/supplier-showroom.heic' | sha256sum -c -
          python -m pip install --quiet pillow pillow-heif
          python - <<'PY'
          from PIL import Image, ImageOps
          from pillow_heif import register_heif_opener
          register_heif_opener()
          image = ImageOps.exif_transpose(Image.open("/tmp/supplier-showroom.heic")).convert("RGB")
          image.thumbnail((1100, 2000), Image.Resampling.LANCZOS)
          assert image.width >= 900 and image.height >= 1400, image.size
          image.save("public/gallery/bmw-showroom-20261011.jpg", quality=82, optimize=True, progressive=True)
          PY
          test "$(file --mime-type -b public/gallery/bmw-showroom-20261011.jpg)" = image/jpeg
          test "$(stat -c%s public/gallery/bmw-showroom-20261011.jpg)" -gt 100000
      - name: Commit optimized photo into the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gallery/bmw-showroom-20261011.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets: add owner-supplied BMW showroom photograph"
            git push origin HEAD:feature/gallery-new-first-photo-20261011
          fi
