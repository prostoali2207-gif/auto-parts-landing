name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Diagnose TypeScript install
        run: |
          cat package.json
          npm config get omit
          npm ls typescript @types/node @types/react @types/react-dom || true
          test -f node_modules/typescript/package.json

      - name: Build
        run: npm run build
