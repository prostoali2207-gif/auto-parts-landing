name: One-time Edge Smoke Test

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Submit test request to landing Edge Function
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -X POST 'https://ybjoayhahbifcrrrykln.supabase.co/functions/v1/create-landing-request' \
            -F 'contact=+971500000777' \
            -F 'clientName=Landing Edge Smoke' \
            -F 'vin=JTDKB20U777777777' \
            -F 'website=' \
            -F 'parts=[{"partName":"Edge smoke test part","partNumber":"SMOKE-777","description":"One-time public endpoint integration test","photoKeys":[]}]')
          echo "$response"
          echo "$response" | grep -q '"ok":true'
