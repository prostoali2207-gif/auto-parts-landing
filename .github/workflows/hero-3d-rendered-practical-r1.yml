name: Hero 3D Rendered Practical R1

on:
  push:
    branches:
      - eval/3d-hero-rendered-practical-r1
    paths:
      - "scripts/hero-3d/**"
      - ".github/workflows/hero-3d-rendered-practical-r1.yml"
      - "docs/agent-architecture/3d-product-visualization-rendered-practical-r1-prerun.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Install known render runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1
          blender --version

      - name: Render practical artifacts only
        run: |
          mkdir -p artifacts/hero-3d-render-r1
          blender --background --python scripts/hero-3d/build_scene.py --             --out-dir artifacts/hero-3d-render-r1             --render-only

      - name: Verify render evidence
        run: |
          python3 scripts/hero-3d/verify_render_review.py artifacts/hero-3d-render-r1

      - name: Upload rendered practical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-3d-rendered-practical-r1
          path: artifacts/hero-3d-render-r1/
          if-no-files-found: error
          retention-days: 14
