name: Visual V3 Review

on:
  pull_request:

jobs:
  render-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: |
          npm run start > /tmp/spline-v3.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/spline-v3.log
          exit 1

      - name: Capture V3 mobile and desktop
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/visual-review.spec.ts --retries=0

      - name: Upload V3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-v3-review
          path: artifacts/visual-review/
          if-no-files-found: error
          retention-days: 1
