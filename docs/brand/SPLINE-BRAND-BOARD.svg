  <!-- Typography -->
  <text x="80" y="765" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#151513">Typography</text>
  <text x="80" y="825" font-family="IBM Plex Sans, Arial, sans-serif" font-size="54" font-weight="700" fill="#151513">Find the right part.</text>
  <text x="80" y="865" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" fill="#66635C">IBM Plex Sans — headings, body, forms, navigation</text>
  <text x="80" y="925" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700" fill="#151513" letter-spacing="2">VIN / OEM / PART NO. / REQUEST ID</text>
  <text x="80" y="960" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" fill="#66635C">IBM Plex Mono — identifiers and technical metadata only</text>

  <!-- Application language -->
  <rect x="1020" y="210" width="500" height="750" fill="#1D1D1A"/>
  <text x="1080" y="275" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700" fill="#B8B2A8" letter-spacing="2">APPLICATION LANGUAGE</text>
  <text x="1080" y="345" font-family="IBM Plex Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F1EA">Precise. Practical.</text>
  <text x="1080" y="390" font-family="IBM Plex Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F1EA">No tuning clichés.</text>
  <rect x="1080" y="450" width="300" height="2" fill="#E85D24"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" fill="#F4F1EA">
    <text x="1080" y="510">• Real parts and real labels</text>
    <text x="1080" y="555">• Hard crops and open space</text>
    <text x="1080" y="600">• Thin rules and index marks</text>
    <text x="1080" y="645">• Orange only as a signal</text>
    <text x="1080" y="690">• Evidence before decoration</text>
  </g>
  <text x="1080" y="775" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="#E85D24" letter-spacing="2">DO NOT USE</text>
  <g font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" fill="#B8B2A8">
    <text x="1080" y="820">gears / shields / speed lines</text>
    <text x="1080" y="855">chrome / neon / racing graphics</text>
    <text x="1080" y="890">generic supercars / fake inventory</text>
  </g>
  <text x="80" y="1040" font-family="IBM Plex Mono, monospace" font-size="14" fill="#66635C">Canonical spec: docs/brand/SPLINE-BRAND-IDENTITY.md</text>
