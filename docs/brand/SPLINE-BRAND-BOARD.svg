  <text x="80" y="455" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#66635C">Primary wordmark — monochrome, uppercase, restrained SP connection.</text>

  <!-- Palette -->
  <text x="80" y="525" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#151513">Core palette</text>
  <g font-family="IBM Plex Mono, monospace" font-size="14" fill="#151513">
